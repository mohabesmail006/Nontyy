<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>قلبي لمنه</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Playfair+Display:ital,wght@1,500&family=Tajawal:wght@400;500&display=swap">
<style>
  /* Layout: full-screen particle heart on top, one sweet line at a time beneath it, final line glows. Single dark look by choice. */
  :root {
    --bg: #12060d;
    --bg2: #2c0e20;
    --rose: #ff4d7d;
    --rose2: #ff7aa2;
    --blush: #ffc2d4;
    --gold: #ffdcae;
    --ink: #fff1f5;
    --mute: #d9a3b5;
    --onrose: #2a0614;
    --glow: rgba(255, 77, 125, 0.55);
    --glow0: rgba(255, 77, 125, 0);
    --display: 'Aref Ruqaa', 'Amiri', 'Traditional Arabic', serif;
    --body: 'Tajawal', system-ui, sans-serif;
    --latin: 'Playfair Display', Georgia, serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(90% 60% at 50% 30%, var(--bg2), transparent 72%);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    overflow: hidden;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  .ui { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .ui > * { pointer-events: auto; }

  button { font: inherit; cursor: pointer; border: 0; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

  /* intro */
  .idle {
    position: absolute;
    left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    top: var(--cy, 34%);
    transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 0.9rem;
    text-align: center;
    transition: opacity 0.6s ease, visibility 0s;
  }
  .idle.gone { opacity: 0; visibility: hidden; transition: opacity 0.6s ease, visibility 0s 0.6s; }
  .eyebrow { margin: 0; color: var(--mute); font-size: 0.95rem; letter-spacing: 0.08em; }
  .idle h1 {
    margin: 0; font-family: var(--display); font-weight: 700;
    font-size: clamp(3.6rem, 15vw, 6.4rem); line-height: 1.3; color: var(--ink);
    text-shadow: 0 0 28px var(--glow);
  }
  .sub { margin: 0; color: var(--blush); font-size: 1.05rem; line-height: 1.7; max-width: 22em; }
  .go {
    margin-top: 0.4rem; min-height: 52px; padding: 0.7rem 2.6rem; border-radius: 999px;
    background: linear-gradient(135deg, var(--rose2), var(--rose));
    color: var(--onrose); font-weight: 500; font-size: 1.2rem;
    box-shadow: 0 0 0 0 var(--glow), 0 12px 32px -10px var(--glow);
    animation: ping 2.2s ease-out infinite;
  }
  @keyframes ping {
    0% { box-shadow: 0 0 0 0 var(--glow), 0 12px 32px -10px var(--glow); }
    70%, 100% { box-shadow: 0 0 0 18px var(--glow0), 0 12px 32px -10px var(--glow); }
  }

  /* text area under the heart */
  .text {
    position: absolute;
    left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    top: var(--tt, 58%);
    bottom: max(12px, env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center;
    text-align: center; overflow-y: auto; overflow-x: hidden;
  }
  .text > * { margin-block: auto; }
  .line {
    font-family: var(--display); font-size: clamp(1.55rem, 5.6vw, 2.5rem);
    line-height: 1.9; max-width: 22em; color: var(--ink);
    text-shadow: 0 0 22px var(--glow);
    margin-inline: 0;
  }
  .line.out { opacity: 0; transition: opacity 0.5s ease; }
  .w {
    display: inline-block; opacity: 0; filter: blur(8px); transform: translateY(10px);
    animation: wIn 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
  }
  @keyframes wIn { to { opacity: 1; filter: blur(0); transform: none; } }

  /* final */
  .final { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  .en {
    margin: 0; direction: ltr; unicode-bidi: isolate;
    font-family: var(--latin); font-style: italic; font-weight: 500;
    font-size: clamp(2.8rem, 12.5vw, 5.6rem); line-height: 1.15; color: var(--ink);
  }
  .en span {
    display: inline-block; opacity: 0; transform: translateY(14px) scale(0.9);
    text-shadow: 0 0 22px var(--glow);
    animation: letter 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes letter { to { opacity: 1; transform: none; } }
  .ar {
    margin: 0; font-family: var(--display); font-weight: 700;
    font-size: clamp(2.8rem, 12vw, 5rem); line-height: 1.5; color: var(--blush);
    text-shadow: 0 0 26px var(--glow);
    opacity: 0; animation: fadeUp 1s 1.1s ease forwards;
  }
  .sig { margin: 0.2rem 0 0; color: var(--mute); font-size: 1rem; opacity: 0; animation: fadeUp 1s 1.8s ease forwards; }
  .ghost {
    margin-top: 1rem; min-height: 44px; padding: 0.55rem 1.6rem; border-radius: 999px;
    background: transparent; color: var(--blush); border: 1px solid var(--mute); font-size: 1rem;
    opacity: 0; animation: fadeUp 1s 2.6s ease forwards;
  }
  .ghost:hover { background: var(--glow0); border-color: var(--blush); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .w, .en span, .ar, .sig, .ghost { animation: none; opacity: 1; transform: none; filter: none; }
    .go { animation: none; }
    .idle, .idle.gone, .line.out { transition: none; }
  }
</style>

<canvas id="c" aria-hidden="true"></canvas>

<div class="ui" dir="rtl" lang="ar">
  <section class="idle" id="idle">
    <button class="go" id="go" type="button">افتحي</button>
  </section>
  <section class="text" id="text" aria-live="polite"></section>
</div>

<script>
(function () {
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var idleEl = document.getElementById('idle');
  var textEl = document.getElementById('text');
  var goBtn = document.getElementById('go');
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  var W = 0, H = 0, cx = 0, cy = 0, S = 1;
  var mode = 'idle', tMode = 0, glow = 0, vis = 0.55, spawn = 0, running = false;
  var P = [], R = [];
  var TAU = Math.PI * 2;

  function build() {
    P.length = 0;
    var n = W < 600 ? 700 : 1100;
    for (var i = 0; i < n; i++) {
      var outline = Math.random() < 0.55;
      var t = Math.random() * TAU;
      var k = outline ? 1 + (Math.random() - 0.5) * 0.05 : Math.sqrt(Math.random()) * 0.97;
      var hx = 16 * Math.pow(Math.sin(t), 3) * k;
      var ym = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      var hy = -(ym * k + 2.5);
      P.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: 0, vy: 0,
        dx: (Math.random() - 0.5) * 0.3, dy: (Math.random() - 0.5) * 0.3,
        hx: hx, hy: hy,
        d: Math.random() * 1.4,
        k: 0.04 + Math.random() * 0.05,
        s: 0.6 + Math.random() * 1.5,
        ph: Math.random() * TAU,
        c: 'hsl(' + (335 + Math.random() * 22).toFixed(0) + ',92%,' + (60 + Math.random() * 20).toFixed(0) + '%)',
        halo: Math.random() < 0.18
      });
    }
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H * 0.34;
    S = Math.min(W / 44, H / 62);
    var st = document.documentElement.style;
    st.setProperty('--cy', cy + 'px');
    st.setProperty('--tt', (cy + 14.5 * S + 26) + 'px');
    if (!P.length) build();
  }

  function heartAt(x, y, s) {
    ctx.beginPath();
    for (var i = 0; i <= 24; i++) {
      var t = i / 24 * TAU;
      var px = x + 16 * Math.pow(Math.sin(t), 3) * s;
      var py = y - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * s;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  function bump(ph, c) { var d = (ph - c) / 0.05; return Math.exp(-d * d); }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    var tm = (now - tMode) / 1000;
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    var b = 1;
    if ((mode === 'beat' || mode === 'final') && !reduce) {
      var ph = ((now / 1000) % 1.15) / 1.15;
      b = 1 + 0.045 * bump(ph, 0.06) + 0.03 * bump(ph, 0.24);
    }

    var gT = mode === 'final' ? 1 : (mode === 'beat' ? 0.6 : 0);
    glow += (gT - glow) * Math.min(1, dt * 1.5);
    vis += ((mode === 'idle' ? 0.55 : 1) - vis) * Math.min(1, dt * 2);

    if (glow > 0.01) {
      var r = S * 26;
      var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, 'rgba(255,77,125,' + (0.22 * glow).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,77,125,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    }

    var f60 = dt * 60;
    for (var i = 0; i < P.length; i++) {
      var p = P[i];
      if (mode === 'idle') {
        p.x += p.vx * f60 + p.dx * f60 + Math.sin(now / 1500 + p.ph) * 0.12;
        p.y += p.vy * f60 + p.dy * f60 + Math.cos(now / 1700 + p.ph) * 0.12;
        var fr = Math.pow(0.96, f60);
        p.vx *= fr; p.vy *= fr;
        if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
      } else {
        var tx = cx + p.hx * S * b;
        var ty = cy + p.hy * S * b;
        if (reduce) { p.x = tx; p.y = ty; }
        else if (tm >= p.d) {
          var k = 1 - Math.pow(1 - p.k, f60);
          p.x += (tx - p.x) * k;
          p.y += (ty - p.y) * k;
        }
      }
      ctx.fillStyle = p.c;
      ctx.globalAlpha = vis;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, TAU); ctx.fill();
      if (p.halo) {
        ctx.globalAlpha = vis * 0.08;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.s * 4.5, 0, TAU); ctx.fill();
      }
    }

    if (mode === 'final' && !reduce) {
      spawn -= dt;
      if (spawn <= 0) {
        spawn = 0.25 + Math.random() * 0.35;
        R.push({ x: Math.random() * W, y: H + 20, s: 0.22 + Math.random() * 0.4, v: 35 + Math.random() * 55, ph: Math.random() * TAU, a: 0.25 + Math.random() * 0.4 });
      }
    }
    ctx.fillStyle = 'rgb(255,92,140)';
    for (var j = R.length - 1; j >= 0; j--) {
      var h = R[j];
      h.y -= h.v * dt;
      if (h.y < -30) { R.splice(j, 1); continue; }
      var fade = Math.max(0, Math.min(1, h.y / (H * 0.25)));
      ctx.globalAlpha = h.a * fade;
      heartAt(h.x + Math.sin(now / 900 + h.ph) * 14, h.y, h.s);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  function scatter() {
    for (var i = 0; i < P.length; i++) {
      var p = P[i];
      var a = Math.atan2(p.y - cy, p.x - cx) + (Math.random() - 0.5) * 0.6;
      var sp = 3 + Math.random() * 9;
      p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
    }
    mode = 'idle';
  }

  var LINES = [
    'نونتي',
    'نغير المفاجأة المرادي ونعمل حاجة هبله',
    'بس هي جت ف دماغي ونا شغال ف قولت اعملها عشان بحبك',
    'وتبطلي نكد'
  ];

  async function say(text) {
    var old = textEl.firstElementChild;
    if (old) { old.classList.add('out'); await sleep(reduce ? 0 : 550); }
    var el = document.createElement('p');
    el.className = 'line';
    var words = text.split(' ');
    words.forEach(function (w, i) {
      var s = document.createElement('span');
      s.className = 'w';
      s.textContent = w;
      s.style.animationDelay = (i * 0.17) + 's';
      el.appendChild(s);
      if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
    });
    textEl.replaceChildren(el);
    await sleep(reduce ? 2600 : words.length * 170 + 2300);
  }

  function showFinal() {
    var old = textEl.firstElementChild;
    var wrap = document.createElement('div');
    wrap.className = 'final';
    var en = document.createElement('p');
    en.className = 'en';
    en.setAttribute('dir', 'ltr');
    'I love you'.split('').forEach(function (ch, i) {
      var s = document.createElement('span');
      s.textContent = ch === ' ' ? ' ' : ch;
      s.style.animationDelay = (i * 0.09) + 's';
      en.appendChild(s);
    });
    var ar = document.createElement('p');
    ar.className = 'ar';
    ar.textContent = 'نونتي';
    var again = document.createElement('button');
    again.type = 'button';
    again.className = 'ghost';
    again.textContent = 'تاني؟';
    again.addEventListener('click', replay);
    wrap.appendChild(en); wrap.appendChild(ar); wrap.appendChild(again);
    textEl.replaceChildren(wrap);
  }

  async function run() {
    mode = 'assemble';
    tMode = performance.now();
    await sleep(reduce ? 200 : 3800);
    mode = 'beat';
    for (var i = 0; i < LINES.length; i++) { await say(LINES[i]); }
    var old = textEl.firstElementChild;
    if (old) { old.classList.add('out'); await sleep(reduce ? 0 : 600); }
    showFinal();
    mode = 'final';
  }

  async function replay() {
    if (running) return;
    running = true;
    var f = textEl.firstElementChild;
    if (f) { f.style.transition = 'opacity .5s'; f.style.opacity = '0'; await sleep(reduce ? 0 : 550); }
    textEl.replaceChildren();
    scatter();
    await sleep(reduce ? 0 : 1200);
    await run();
    running = false;
  }

  goBtn.addEventListener('click', async function () {
    if (running) return;
    running = true;
    idleEl.classList.add('gone');
    await sleep(reduce ? 0 : 600);
    await run();
    running = false;
  });

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
